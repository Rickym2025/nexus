<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI | Partner Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030307; color: #f4f4f5; font-family: sans-serif; }
        .glass-panel { background: rgba(10, 10, 15, 0.92); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-12 pb-6 border-b border-white/5">
            <div class="flex items-center gap-3">
                <span class="text-xs bg-cyan-500/10 text-cyan-400 font-bold border border-cyan-500/20 px-3 py-1 rounded-full uppercase tracking-widest">Reseller Hub</span>
                <h1 class="text-xl font-bold text-white uppercase tracking-wider">Gestione Clienti</h1>
            </div>
            <div id="agency-badge" class="text-sm text-zinc-400 font-mono"></div>
        </header>

        <!-- Griglia dei Bot Gestiti -->
        <h2 class="text-lg font-bold text-white mb-6 uppercase tracking-wider">I tuoi Chatbot attivi</h2>
        <div id="bots-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- I bot dell'agenzia verranno caricati qui via JavaScript -->
            <p class="text-zinc-500 text-sm">Caricamento in corso... ⏳</p>
        </div>
    </div>

<script>
        const API_URL = 'https://api-creator.nexus.rmstudio.app'; // L'URL del tuo server Hetzner

        // 1. Estrazione dinamica del parametro agency_id dall'URL
        const urlParams = new URLSearchParams(window.location.search);
        let AGENCY_ID = urlParams.get('agency_id');

        if (AGENCY_ID) {
            // Se presente nell'URL, lo salviamo in localStorage per gli accessi futuri
            localStorage.setItem('partner_agency_id', AGENCY_ID);
        } else {
            // Altrimenti proviamo a recuperarlo dalla memoria locale del browser
            AGENCY_ID = localStorage.getItem('partner_agency_id');
        }

        // 2. Se non troviamo nessun ID agenzia, blocchiamo la visualizzazione
        if (!AGENCY_ID) {
            document.getElementById('agency-badge').innerHTML = `<span class="text-red-400">ID Agenzia Mancante</span>`;
            document.getElementById('bots-list').innerHTML = `
                <div class="glass-panel p-8 rounded-2xl col-span-full text-center border-red-500/20">
                    <p class="text-red-400 font-bold mb-2">Accesso non autorizzato ⚠️</p>
                    <p class="text-zinc-400 text-sm">Per accedere alla tua area partner, utilizza il link personalizzato fornito dall'amministratore.</p>
                </div>
            `;
        } else {
            document.getElementById('agency-badge').textContent = `Agenzia: ${AGENCY_ID}`;
            loadAgencyBots();
        }

        // 3. Funzione di caricamento dei bot associati all'agenzia
        async function loadAgencyBots() {
            const listContainer = document.getElementById('bots-list');
            
            try {
                const res = await fetch(`${API_URL}/api/agency/bots?agency_id=${encodeURIComponent(AGENCY_ID)}`);
                const data = await res.json();

                if (data.success && data.bots.length > 0) {
                    listContainer.innerHTML = '';
                    data.bots.forEach(bot => {
                        const card = document.createElement('div');
                        card.className = 'glass-panel p-6 rounded-2xl flex flex-col justify-between space-y-4 transition-all hover:border-cyan-500/30';
                        card.innerHTML = `
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs uppercase px-2 py-1 rounded-md ${bot.is_paid ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'}">
                                        ${bot.is_paid ? 'Attivo Pro' : 'Demo Gratuita'}
                                    </span>
                                    <span class="text-xs text-zinc-500 font-mono">${bot.id}</span>
                                </div>
                                <h3 class="text-base font-bold text-white mb-1">${bot.nome_struttura}</h3>
                                <p class="text-xs text-zinc-400 truncate">${bot.website || 'Nessun sito collegato'}</p>
                            </div>
                            <div class="pt-4 border-t border-white/5 flex gap-2">
                                <a href="https://nexus.rmstudio.app/config.html?bot_id=${bot.id}" target="_blank" class="w-full text-center bg-cyan-500 text-black font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider hover:bg-cyan-400 transition">
                                    Configura AI
                                </a>
                                <a href="${API_URL}/?site=${encodeURIComponent(bot.website)}&bot_id=${bot.id}" target="_blank" class="w-full text-center bg-zinc-900 border border-zinc-800 text-white font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider hover:bg-zinc-800 transition">
                                    Vedi Demo
                                </a>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.innerHTML = `<p class="text-zinc-500 text-sm">Non hai ancora nessun bot attivo nel tuo portafoglio agenzia.</p>`;
                }
            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `<p class="text-red-400 text-sm">Errore di caricamento. Verifica la connessione con il server.</p>`;
            }
        }
    </script>
</body>
</html>
